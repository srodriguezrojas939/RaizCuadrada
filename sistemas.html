<style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');

    /* --- BASE --- */
    body { 
        background: #ffffff; 
        font-family: 'Open Sans', sans-serif; 
        margin: 0; 
        padding: 20px; 
        display: flex; 
        justify-content: center; 
        min-height: 100vh;
        transition: background 0.3s ease;
    }

      /* --- ANIMACIONES --- */
    .fade-in { 
        opacity: 0; 
        transform: translateY(20px); 
        animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
        width: 100%; 
        max-width: 600px; /* Ancho idéntico al wrapper de comentarios */
        margin: 0 auto;
    }
    
    @keyframes fadeUp { 
        from { opacity: 0; transform: translateY(30px); } 
        to { opacity: 1; transform: translateY(0); } 
    }

    /* --- CONTENEDOR PRINCIPAL --- */
     .calculadora {
        background: #ffffff; /* Fondo limpio tipo tarjeta */
        padding: 40px 35px; 
        border-radius: 40px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.08); /* Sombra exacta de comentarios */
        box-sizing: border-box;
        font-family: 'Open Sans', sans-serif;
    }


    /* --- HEADER --- */
   .header-section { text-align: center; margin-bottom: 35px; }
    
    .header-section h1 { 
        font-family: 'Playfair Display', serif; 
        font-size: clamp(24px, 6vw, 32px); /* Responsive como title-big */
        margin: 0; 
        font-weight: 700; 
        color: #1a1a1a; 
        line-height: 1.1;
    }
    
    .header-section p { 
        font-family: 'Open Sans', sans-serif; 
        font-size: 13px; 
        margin: 10px 0 0; 
        font-weight: 700; 
        color: #999; 
        text-transform: uppercase; 
        letter-spacing: 1.5px; /* Estilo 'pregunta-pro' */
    }

    /* --- PREVIEW Y RESULTADOS --- */
   #preview-container, #resultado {
        background: #f9f9f9; /* Mismo gris que los inputs */
        margin-bottom: 25px; 
        padding: 20px;
        border-radius: 25px; 
        min-height: 70px; 
        display: flex;
        align-items: center; 
        justify-content: center; 
        border: 2px solid transparent; /* Para mantener consistencia */
        overflow-x: auto;
        box-shadow: 0 2px 5px rgba(0,0,0,0.02) inset; /* Sombra interna sutil */
        font-size: 1.1rem;
        color: #333;
    }

    /* --- INPUTS --- */
    .input-group { margin-bottom: 20px; }
    
     label { 
        display: block; 
        font-size: 12px; 
        font-weight: 700; 
        margin-bottom: 10px;
        margin-left: 15px; 
        color: #555; 
        text-transform: uppercase; 
        letter-spacing: 0.5px; /* Estilo exacto de form-group label */
    }
    
    input {
        width: 100%; 
        padding: 16px 22px; 
        margin-top: 5px; 
        border-radius: 25px;
        border: 2px solid transparent; 
        background: #f9f9f9;
        box-sizing: border-box; 
        font-size: 15px; 
        outline: none;
        font-family: 'Open Sans', sans-serif; 
        transition: all 0.3s ease;
        box-shadow: 0 2px 5px rgba(0,0,0,0.02) inset;
        color: #333;
    }
    input:focus { 
        background: white;
        border-color: #1a1a1a; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        transform: translateY(-3px);
    }

    /* --- CONTROLES FILAS (Botones Pequeños) --- */
    .controles-filas { display: flex; gap: 15px; margin-bottom: 25px; }
    
    .btn-mini {
        flex: 1; 
        padding: 14px; 
        border-radius: 999px; /* Píldora completa */
        border: 1px solid #e0e0e0;
        background: transparent; 
        cursor: pointer; 
        font-size: 13px; 
        font-weight: 600;
        color: #666;
        font-family: 'Open Sans', sans-serif; 
        transition: 0.3s;
        display: flex; 
        justify-content: center; 
        align-items: center;
    }
    .btn-mini:hover { 
        background: #f4f4f4; 
        color: #333; 
        border-color: #ccc; 
    }

    /* --- OPCIÓN DECIMAL (Contenedor Switch) --- */
    .opcion-decimal {
        display: flex; 
        align-items: center; 
        justify-content: space-between;
        background: #f9f9f9; 
        padding: 15px 25px; 
        border-radius: 55px; 
        margin-bottom: 30px;
        border: 2px solid transparent;
        box-shadow: 0 2px 5px rgba(0,0,0,0.02) inset;
        color: #555;
        font-weight: 600;
        font-size: 14px;
    }

    /* --- SWITCH --- */
    .switch { position: relative; display: inline-block; width: 46px; height: 24px; margin-top: 8px}
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background: #1a1a1a; }
    input:checked + .slider:before { transform: translateX(22px); }

    /* --- BOTÓN PRINCIPAL --- */
    .btn-principal {
        width: 100%; 
        background: #1a1a1a; 
        color: white; 
        border: none;
        padding: 18px 35px; 
        border-radius: 999px; 
        font-size: 16px; 
        font-weight: 700;
        cursor: pointer; 
        margin-bottom: 30px;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        font-family: 'Open Sans', sans-serif;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .btn-principal:hover { 
        transform: translateY(-3px) scale(1.02); 
        box-shadow: 0 8px 15px rgba(0,0,0,0.15); 
        background: #000;
    }

  @media (max-width: 400px) {
    .controls-container {
        grid-template-columns: 1fr;
    }
}

    /* --- PÍLDORAS (Navegación) --- */
    .pills-nav { display: flex; justify-content: center; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
    .pill { 
        background: #f4f4f4; 
        border: 1px solid transparent; 
        padding: 10px 18px; 
        border-radius: 999px; 
        font-size: 13px; 
        cursor: pointer; 
        transition: all 0.3s; 
        font-weight: 600; 
        color: #666; 
        font-family: 'Open Sans', sans-serif; 
    }
    .pill.active { 
        background: #1a1a1a; 
        color: white; 
        box-shadow: 0 8px 15px rgba(0,0,0,0.15); 
        transform: scale(1.05);
    }
    .pill:hover:not(.active) { background: #e0e0e0; }

    /* --- SIMBOLOS --- */
    .symbols-container { 
        background: #ffffff; 
        border-radius: 30px; 
        padding: 20px; 
        margin-top: 25px; 
        border: 1px solid #f0f0f0; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    }
    .symbols-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 10px; }
    .sym-btn { 
        background: #fff; 
        border: 1px solid #eee; 
        padding: 15px 5px; 
        border-radius: 15px; 
        text-align: center; 
        cursor: pointer; 
        transition: 0.2s; 
        font-size: 14px; 
        color: #333;
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center;
        font-family: 'Open Sans', sans-serif;
    }
    .sym-btn:hover { 
        background: #f9f9f9; 
        transform: translateY(-2px); 
        border-color: #ddd; 
    }
    .sym-btn span { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .sym-btn small { font-size: 9px; text-transform: uppercase; color: #999; font-weight: 700; }

    /* ========================================= */
    /* MODO OSCURO                   */
    /* ========================================= */
    
     [data-theme="dark"] .body { 
        background: 
        #0a0a0a; }
        
  [data-theme="dark"] .calculadora {
        background: transparent; /* O #1a1a1a si prefieres tarjeta sólida */
        box-shadow: none;
        border: 1px solid rgba(255,255,255,0.1);
    }

    [data-theme="dark"] .header-section h1 { color: #ffffff; }
    [data-theme="dark"] .header-section p { color: #888; }
    [data-theme="dark"] label { color: #888; }

    /* Inputs Dark Mode */
    [data-theme="dark"] input[type="text"], 
    [data-theme="dark"] select,
    [data-theme="dark"] #preview-container,
    [data-theme="dark"] .opcion-decimal-container {
        background: #1e1e1e; 
        color: #ffffff; 
        box-shadow: none;
        border: 1px solid #333;
    }
    
    [data-theme="dark"] input:focus, [data-theme="dark"] select:focus {
        border-color: #666;
        background: #252525;
    }
    
    [data-theme="dark"] #resultado {
        background: #1e1e1e;
        color: #fff;
        border: 1px solid #333;
    }

    /* Botones Dark Mode */
    [data-theme="dark"] .btn-principal {
        background: #ffffff;
        color: #000000;
        box-shadow: 0 4px 15px rgba(255,255,255,0.1);
    }
    [data-theme="dark"] .btn-principal:hover { background: #e0e0e0; }
    
    [data-theme="dark"] .btn-secundario {
        border-color: #444;
        color: #ccc;
    }
    [data-theme="dark"] .btn-secundario:hover { background: #333; color: white; }

    /* Chips Dark Mode */
    [data-theme="dark"] .pill { background: #1e1e1e; color: #ccc; border-color: transparent; }
    [data-theme="dark"] .pill.active { background: #ffffff; color: #000; }

    /* Symbols Dark Mode */
    [data-theme="dark"] .symbols-container {
        background: #1a1a1a;
        border-color: #333;
    }
    [data-theme="dark"] .sym-btn {
        background: #222;
        border-color: #333;
        color: #eee;
    }
    [data-theme="dark"] .sym-btn:hover { background: #333; }
    
    
</style>
